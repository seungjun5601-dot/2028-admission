<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2028 대입 전형시행계획 자료실</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:    #1a3a5c;
  --blue:    #2563eb;
  --blue2:   #1d4ed8;
  --green:   #047857;
  --green2:  #059669;
  --purple:  #6d28d9;
  --purple2: #7c3aed;
  --gray:    #6b7280;
  --bg:      #eef2f7;
  --card:    #ffffff;
  --border:  #d1d9e6;
  --text:    #1e293b;
  --sub:     #64748b;
  --radius:  10px;
  --shadow:  0 2px 8px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
}

body {
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── 헤더 ── */
.site-header {
  background: var(--navy);
  padding: 28px 24px 22px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

/* 학교 아이덴티티 + 타이틀 묶음 */
.title-group {
  display: flex;
  align-items: center;
  gap: 16px;
}
.school-logo {
  height: 58px;
  width: auto;
  flex-shrink: 0;
  opacity: .92;
}
.title-text { display: flex; flex-direction: column; gap: 2px; }
.school-label {
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: #7dd3ae;
  text-transform: uppercase;
  margin-bottom: 1px;
}
.site-title {
  color: #fff;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -.3px;
  line-height: 1.2;
}
.site-title small {
  display: block;
  font-size: .76rem;
  font-weight: 400;
  color: #94a8c4;
  margin-top: 4px;
}
.stats-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stat-chip {
  background: rgba(255,255,255,.1);
  color: #c7d9ef;
  font-size: .74rem;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
.stat-chip b { color: #fff; font-weight: 700; }

/* 검색 영역 — 흰 박스 스타일 */
.search-wrap {
  display: flex; align-items: center;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 3px 14px rgba(0,0,0,.22);
  overflow: hidden;
}
.search-icon-lbl {
  padding: 0 13px; color: #94a3b8; font-size: 1rem; flex-shrink: 0;
  user-select: none;
}
.search-input {
  flex: 1; border: none; background: transparent; outline: none;
  color: var(--text); font-size: .97rem;
  padding: 12px 4px;
}
.search-input::placeholder { color: #94a3b8; }
.search-clear {
  background: none; border: none; cursor: pointer;
  color: #94a3b8; font-size: 1rem; padding: 0 14px;
  display: none; align-items: center; line-height: 1;
}
.search-clear:hover { color: #475569; }
.search-clear.visible { display: flex; }

/* ── 지역 필터 ── */
.filter-bar {
  background: #fff;
  border-bottom: 1px solid var(--border);
}
.filter-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  gap: 6px 8px;
  align-items: center;
  flex-wrap: wrap;
}
.filter-label { font-size: .78rem; color: var(--sub); margin-right: 4px; flex-shrink: 0; }
.chip {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: #f8fafc;
  color: var(--sub);
  font-size: .83rem;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.chip:hover { border-color: var(--blue); color: var(--blue); background: #eff6ff; }
.chip.active { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.chip-star { background: #fffbeb; border-color: #f59e0b; color: #b45309; font-weight: 700; }
.chip-star:hover { background: #fef3c7; border-color: #d97706; }
.chip-star.active { background: #f59e0b; border-color: #d97706; color: #fff; }
.filter-divider { width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex-shrink: 0; align-self: center; }

/* 보조 필터 */
.filter-extra { background: #f8fafc; border-bottom: 1px solid var(--border); }
.filter-extra-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 8px 20px;
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
}
.check-filter {
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; font-size: .82rem; color: var(--sub); user-select: none;
}
.check-filter input { accent-color: var(--blue); cursor: pointer; }
.check-filter:hover { color: var(--text); }
.result-count { margin-left: auto; font-size: .8rem; color: var(--sub); }

/* ── 그리드 ── */
.main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
#grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
@media (max-width: 1024px) { #grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 600px)  { #grid { grid-template-columns: 1fr; gap: 10px; } }

/* ── 카드 ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  transition: box-shadow .2s, transform .15s;
}
.card:hover { box-shadow: 0 4px 18px rgba(0,0,0,.12); transform: translateY(-1px); }

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.card-name {
  font-size: 1rem; font-weight: 700;
  color: var(--text); line-height: 1.3; word-break: keep-all; flex: 1;
}
.card-badges { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
.badge { font-size: .68rem; padding: 2px 7px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
.badge-region          { background: #e0f2fe; color: #0369a1; }
.badge-type-국립       { background: #dcfce7; color: #166534; }
.badge-type-공립       { background: #fef9c3; color: #854d0e; }
.badge-type-사립       { background: #f1f5f9; color: #475569; }
.badge-type-특수       { background: #fce7f3; color: #9d174d; }

/* 버튼 */
.btn-row { display: flex; flex-direction: column; gap: 7px; }
.doc-btn {
  display: flex; align-items: center;
  padding: 9px 14px; border-radius: 7px;
  font-size: .83rem; font-weight: 600;
  cursor: pointer; border: none;
  text-decoration: none; transition: all .15s; line-height: 1.2;
}
.doc-btn .btn-label { flex: 1; }
.doc-btn .btn-arrow { font-size: .75rem; opacity: .5; margin-left: 8px; flex-shrink: 0; }

.btn-plan   { background: #eff6ff; color: var(--blue2);  border: 1px solid #bfdbfe; }
.btn-plan:hover   { background: #dbeafe; border-color: var(--blue); }
.btn-guide  { background: #ecfdf5; color: var(--green);  border: 1px solid #a7f3d0; }
.btn-guide:hover  { background: #d1fae5; border-color: var(--green2); }
.btn-major  { background: #f5f3ff; color: var(--purple); border: 1px solid #ddd6fe; }
.btn-major:hover  { background: #ede9fe; border-color: var(--purple2); }
.btn-disabled { background: #f8fafc; color: #b0bec5; border: 1px solid #e8edf3; cursor: default; pointer-events: none; }

/* 입학처 버튼 */
.btn-url {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 7px;
  font-size: .8rem; font-weight: 600;
  border: 1.5px solid #cbd5e1; background: #f8fafc; color: #475569;
  text-decoration: none; transition: all .2s; line-height: 1.2;
}
.btn-url:hover { border-color: var(--navy); background: var(--navy); color: #fff; }

/* 빈 상태 */
#empty-msg { display: none; grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--sub); }
#empty-msg .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
#empty-msg p { font-size: 1rem; }

/* 타입 뱃지 (YouTube / Notion / 웹 / Drive) */
.type-tag {
  display: inline-block; font-size: .6rem; font-weight: 700;
  padding: 1px 5px; border-radius: 3px; margin-left: 5px;
  vertical-align: middle; letter-spacing: .2px;
}
.type-youtube { background: #fee2e2; color: #b91c1c; }
.type-notion  { background: #f3f4f6; color: #374151; }
.type-web     { background: #e0f2fe; color: #0369a1; }
.type-drive   { background: #dcfce7; color: #15803d; }

/* 대학 로고 */
.name-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.univ-logo {
  width: 30px; height: 30px; border-radius: 5px;
  object-fit: contain; flex-shrink: 0;
  border: 1px solid var(--border); background: #f8fafc; padding: 1px;
}

/* 인쇄 */
@media print {
  .site-header, .filter-bar, .filter-extra { display: none; }
  .main { padding: 0; max-width: 100%; }
  #grid { grid-template-columns: repeat(2,1fr); gap: 8px; }
  .card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
  .doc-btn { padding: 5px 8px; font-size: .75rem; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="title-group">
        <img class="school-logo" src="./school_logo_white.png" alt="덕인고등학교">
        <div class="title-text">
          <div class="site-title">
            2028 입학전형 시행계획 자료실
            <small>담임선생님을 위한 대학 입시 자료 모음 · 2026년 5월 기준</small>
          </div>
        </div>
      </div>
      <div class="stats-row" id="stats-row">
        <span class="stat-chip">로딩 중...</span>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon-lbl">🔍</span>
      <input class="search-input" type="text" id="search"
        placeholder="대학 이름으로 검색  예) 서울대 · 연세 · 부산대"
        autocomplete="off" spellcheck="false">
      <button class="search-clear" id="search-clear" title="지우기">✕</button>
    </div>
  </div>
</header>

<nav class="filter-bar">
  <div class="filter-inner" id="region-chips">
    <span class="filter-label">지역</span>
  </div>
</nav>

<div class="filter-extra">
  <div class="filter-extra-inner">
    <label class="check-filter">
      <input type="checkbox" id="chk-guide"> 학종 안내서 있는 곳만
    </label>
    <label class="check-filter">
      <input type="checkbox" id="chk-major"> 전공 안내 있는 곳만
    </label>
    <label class="check-filter">
      <input type="checkbox" id="chk-url"> 입학처 링크 있는 곳만
    </label>
    <span class="result-count" id="result-count"></span>
  </div>
</div>

<main class="main">
  <div id="grid">
    <div id="empty-msg">
      <div class="empty-icon">🔍</div>
      <p>검색 결과가 없습니다.</p>
    </div>
  </div>
</main>

<script src="universities.js"></script>
<script>
const PLAN_BASE  = "./카테고리별_전체모음/2028계획/";
const GUIDE_BASE = "./카테고리별_전체모음/학종안내서/";
const MAJOR_BASE = "./카테고리별_전체모음/전공안내/";

const REGION_ORDER = ["전체","서울","경기","인천","강원","충남","충북","대전","세종","전북","전남","광주","경남","경북","대구","부산","울산","제주"];

// 주요대학 목록 (정확한 이름 일치)
const TOP_UNIVS = [
  "건국대학교(서울)","경희대학교(서울)","고려대학교(서울)","동국대학교(서울)",
  "서강대학교","서울대학교","서울시립대학교","성균관대학교(서울)",
  "숙명여자대학교","연세대학교(서울)","이화여자대학교","인하대학교",
  "중앙대학교(서울)","한국외국어대학교(서울)","한양대학교(서울)"
];

// 타입별 아이콘 & 배지 텍스트
const T_ICON  = { pdf:"📄", drive:"☁️", youtube:"▶", notion:"📝", web:"🔗" };
const T_BADGE = { drive:"Drive", youtube:"YouTube", notion:"Notion", web:"웹페이지" };

let activeRegion = "전체";
let activeTop    = false;
let searchQuery  = "";
let onlyGuide = false, onlyMajor = false, onlyUrl = false;

// 리소스 가용성 판단
const hasPlan  = u => !!(u.plan  || u.planLink);
const hasGuide = u => !!(u.guide || u.guideLink);
const hasMajor = u => !!(u.major || u.majorLink);

function init() {
  buildStats();
  buildRegionChips();
  render();

  const searchEl = document.getElementById("search");
  const clearBtn = document.getElementById("search-clear");

  searchEl.addEventListener("input", e => {
    searchQuery = e.target.value.trim();
    clearBtn.classList.toggle("visible", searchQuery.length > 0);
    render();
  });
  clearBtn.addEventListener("click", () => {
    searchEl.value = ""; searchQuery = "";
    clearBtn.classList.remove("visible");
    render();
  });
  document.getElementById("chk-guide").addEventListener("change", e => { onlyGuide = e.target.checked; render(); });
  document.getElementById("chk-major").addEventListener("change", e => { onlyMajor = e.target.checked; render(); });
  document.getElementById("chk-url").addEventListener("change",   e => { onlyUrl   = e.target.checked; render(); });
}

function buildStats() {
  const total     = UNIVERSITIES.length;
  const withPlan  = UNIVERSITIES.filter(hasPlan).length;
  const withGuide = UNIVERSITIES.filter(hasGuide).length;
  const withMajor = UNIVERSITIES.filter(hasMajor).length;
  const withUrl   = UNIVERSITIES.filter(u => u.url).length;
  document.getElementById("stats-row").innerHTML =
    `<span class="stat-chip">총 <b>${total}</b>개교</span>` +
    `<span class="stat-chip">시행계획 <b>${withPlan}</b>건</span>` +
    `<span class="stat-chip">학종안내서 <b>${withGuide}</b>건</span>` +
    `<span class="stat-chip">전공안내 <b>${withMajor}</b>건</span>` +
    `<span class="stat-chip">입학처링크 <b>${withUrl}</b>건</span>`;
}

function buildRegionChips() {
  const allRegions = [...new Set(UNIVERSITIES.map(u => u.region))];
  const ordered = REGION_ORDER.filter(r => r === "전체" || allRegions.includes(r));
  const extra   = allRegions.filter(r => !REGION_ORDER.includes(r));
  const regions = [...ordered, ...extra];

  const container = document.getElementById("region-chips");
  const label = container.querySelector(".filter-label");
  container.innerHTML = "";

  // ── 주요대학 칩 ──
  const topCount = UNIVERSITIES.filter(u => TOP_UNIVS.includes(u.name)).length;
  const topBtn = document.createElement("button");
  topBtn.className = "chip chip-star" + (activeTop ? " active" : "");
  topBtn.textContent = `⭐ 주요대학 (${topCount})`;
  topBtn.addEventListener("click", () => {
    activeTop = !activeTop;
    if (activeTop) activeRegion = "전체";
    buildRegionChips();
    render();
  });
  container.appendChild(topBtn);

  // 구분선
  const divider = document.createElement("span");
  divider.className = "filter-divider";
  container.appendChild(divider);

  // ── 지역 칩 ──
  container.appendChild(label);

  regions.forEach(r => {
    const btn = document.createElement("button");
    btn.className = "chip" + (!activeTop && r === activeRegion ? " active" : "");
    const count = r === "전체" ? UNIVERSITIES.length : UNIVERSITIES.filter(u => u.region === r).length;
    btn.textContent = r === "전체" ? `전체 (${count})` : `${r} (${count})`;
    btn.dataset.region = r;
    btn.addEventListener("click", () => {
      activeTop    = false;
      activeRegion = r;
      buildRegionChips();
      render();
    });
    container.appendChild(btn);
  });
}

function filtered() {
  return UNIVERSITIES.filter(u => {
    // 검색어가 있으면 전체 대학에서 검색 (지역·주요대학 필터 무시)
    if (searchQuery) {
      const q = searchQuery.replace(/\s/g, "");
      if (!u.name.replace(/\s/g, "").includes(q)) return false;
    } else {
      // 검색어 없을 때만 지역·주요대학 필터 적용
      if (activeTop && !TOP_UNIVS.includes(u.name)) return false;
      if (!activeTop && activeRegion !== "전체" && u.region !== activeRegion) return false;
    }
    if (onlyGuide && !hasGuide(u)) return false;
    if (onlyMajor && !hasMajor(u)) return false;
    if (onlyUrl   && !u.url)       return false;
    return true;
  });
}

function render() {
  const list  = filtered();
  const grid  = document.getElementById("grid");
  const empty = document.getElementById("empty-msg");

  [...grid.children].forEach(el => { if (el !== empty) el.remove(); });
  document.getElementById("result-count").textContent = `${list.length}개교 표시 중`;

  if (list.length === 0) { empty.style.display = "block"; return; }
  empty.style.display = "none";

  const frag = document.createDocumentFragment();
  list.forEach(u => frag.appendChild(makeCard(u)));
  grid.insertBefore(frag, empty);
}

function makeCard(u) {
  // 실제 사용할 href & 타입 결정 (외부링크 우선 → 로컬 PDF 폴백)
  const planHref  = u.planLink  || (u.plan  ? PLAN_BASE  + u.plan  : null);
  const planType  = u.planLink  ? "drive"      : (u.plan  ? "pdf" : null);
  const guideHref = u.guideLink || (u.guide ? GUIDE_BASE + u.guide : null);
  const guideType = u.guideLink ? u.guideType  : (u.guide ? "pdf" : null);
  const majorHref = u.majorLink || (u.major ? MAJOR_BASE + u.major : null);
  const majorType = u.majorLink ? u.majorType  : (u.major ? "pdf" : null);

  const card = document.createElement("div");
  card.className = "card";

  // ── 헤더 (로고 + 이름 + 뱃지) ──
  const head = document.createElement("div");
  head.className = "card-head";

  let logoHtml = "";
  if (u.logo) {
    logoHtml = `<img class="univ-logo" src="${esc(u.logo)}" alt="" loading="lazy" onerror="this.style.display='none'">`;
  }
  head.innerHTML =
    `<div class="name-wrap">${logoHtml}<div class="card-name">${esc(u.name)}</div></div>` +
    `<div class="card-badges">` +
      `<span class="badge badge-region">${esc(u.region)}</span>` +
      `<span class="badge badge-type-${u.type}">${esc(u.type)}</span>` +
    `</div>`;
  card.appendChild(head);

  // ── 버튼 행 ──
  const btnRow = document.createElement("div");
  btnRow.className = "btn-row";

  if (planHref)  btnRow.appendChild(makeResBtn(planHref,  planType,  "btn-plan",  "2028 입학전형 시행계획"));
  else           btnRow.appendChild(makeDisabled("2028 계획 미제공"));

  if (guideHref) btnRow.appendChild(makeResBtn(guideHref, guideType, "btn-guide", "학생부종합전형 안내서"));
  else           btnRow.appendChild(makeDisabled("학종 안내서 미제공"));

  if (majorHref) btnRow.appendChild(makeResBtn(majorHref, majorType, "btn-major", "전공 안내서"));
  else           btnRow.appendChild(makeDisabled("전공 안내 미제공"));

  card.appendChild(btnRow);

  // ── 입학처 버튼 ──
  if (u.url) {
    const link = document.createElement("a");
    link.className = "btn-url";
    link.href = u.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.innerHTML = `🏫 입학처 홈페이지 ↗`;
    card.appendChild(link);
  }

  return card;
}

function makeResBtn(href, type, colorCls, label) {
  const a = document.createElement("a");
  a.className = `doc-btn ${colorCls}`;
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  const badge = (type && type !== "pdf" && T_BADGE[type])
    ? `<span class="type-tag type-${type}">${T_BADGE[type]}</span>` : "";
  a.innerHTML =
    `<span class="btn-label">${esc(label)}${badge}</span>` +
    `<span class="btn-arrow">↗</span>`;
  return a;
}

function makeDisabled(label) {
  const div = document.createElement("div");
  div.className = "doc-btn btn-disabled";
  div.innerHTML = `<span class="btn-label">${esc(label)}</span>`;
  return div;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

init();
</script>
</body>
</html>
